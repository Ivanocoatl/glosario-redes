<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flashcards & Glosario Interactivo de Redes</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --app-color: #3b82f6;
      --tra-color: #22c55e;
      --net-color: #ef4444;
      --lin-color: #f97316;
      --phy-color: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem 1rem 0.5rem 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .title-area {
      text-align: center;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .search-bar {
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .filters {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
    }

    .container {
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .block-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin: 1.5rem 0 0.75rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .block-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .acronym-badge {
      font-size: 1.25rem;
      font-weight: 900;
      font-family: monospace;
      color: var(--text);
    }

    .pins-container {
      display: flex;
      gap: 0.3rem;
    }

    .pin-tag {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .term-english {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.2rem;
    }

    .term-spanish {
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 0.75rem;
    }

    .mnemonic-box {
      background: rgba(15, 23, 42, 0.6);
      border-left: 3px solid var(--primary);
      padding: 0.6rem 0.8rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.8rem;
      color: #cbd5e1;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }

    .practice-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 1.5rem;
      justify-content: space-between;
    }

    .practice-overlay.active {
      display: flex;
    }

    .practice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flashcard {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
      cursor: pointer;
      user-select: none;
    }

    .flashcard-acronym {
      font-size: 2.5rem;
      font-weight: 900;
      font-family: monospace;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .flashcard-prompt {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .flashcard-answer {
      display: none;
      animation: fadeIn 0.3s forwards;
    }

    .flashcard.flipped .flashcard-prompt {
      display: none;
    }

    .flashcard.flipped .flashcard-answer {
      display: block;
    }

    .btn-action {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.85rem 1.5rem;
      font-weight: 700;
      border-radius: 12px;
      font-size: 0.95rem;
      width: 100%;
      cursor: pointer;
    }

    .floating-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      border: none;
      border-radius: 30px;
      padding: 0.85rem 1.5rem;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.4);
      cursor: pointer;
      z-index: 90;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-area">
      <h1>Glosario Técnico de Redes</h1>
      <p class="subtitle">Acrónimos, Capas OSI/TCP-IP e Imágenes Mentales</p>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 Buscar acrónimo, término o capa..." oninput="filterData()">
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('ALL', this)">Todos</button>
      <button class="filter-btn" style="border-color: var(--app-color);" onclick="setFilter('APP', this)">🔵 APP</button>
      <button class="filter-btn" style="border-color: var(--tra-color);" onclick="setFilter('TRA', this)">🟢 TRA</button>
      <button class="filter-btn" style="border-color: var(--net-color);" onclick="setFilter('NET', this)">🔴 NET</button>
      <button class="filter-btn" style="border-color: var(--lin-color);" onclick="setFilter('LIN', this)">🟠 LIN</button>
      <button class="filter-btn" style="border-color: var(--phy-color);" onclick="setFilter('PHY', this)">🟡 PHY</button>
    </div>
  </div>

  <div class="container" id="cardsContainer"></div>

  <button class="floating-btn" onclick="startPractice()">⚡ Modo Flashcards</button>

  <div class="practice-overlay" id="practiceOverlay">
    <div class="practice-header">
      <span style="font-weight: 700; color: var(--primary);" id="practiceProgress">1 / 59</span>
      <button style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem;" onclick="closePractice()">✕</button>
    </div>

    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-acronym" id="cardAcronym">TCP</div>
      <div class="flashcard-prompt">Toca para revelar significado e imagen mental</div>
      <div class="flashcard-answer" id="cardAnswer">
        <div style="font-weight: 700; color: var(--primary); margin-bottom: 0.3rem;" id="cardEnglish"></div>
        <div style="margin-bottom: 1rem;" id="cardSpanish"></div>
        <div class="mnemonic-box" style="text-align: left;">
          <span>🧠</span>
          <span id="cardMnemonic"></span>
        </div>
      </div>
    </div>

    <button class="btn-action" onclick="nextCard()">Siguiente Acrónimo ➔</button>
  </div>

  <script>

      {"block": "BLOQUE 6: CAPA DE APLICACIÓN Y TECNOLOGÍAS MÓVILES", "acronym": "HTTP", "english": "HyperText Transfer Protocol", "spanish": "Protocolo de Transferencia de Hipertexto", "pin": "🔵", "img": "Una mano pidiendo una hoja de papel (página web) a una biblioteca gigante."},
      {"block": "BLOQUE 6: CAPA DE APLICACIÓN Y TECNOLOGÍAS MÓVILES", "acronym": "HTTPS", "english": "HTTP Secure", "spanish": "HTTP Seguro", "pin": "🔵", "img": "La misma mano pero usando guantes blindados y entregando el papel en una caja fuerte."},

      {"block": "BLOQUE 6: CAPA DE APLICACIÓN Y TECNOLOGÍAS MÓVILES", "acronym": "SMTP", "english": "Simple Mail Transfer Protocol", "spanish": "Protocolo Simple de Transferencia de Correo", "pin": "🔵", "img": "Un buzón de correo azul con una flecha apuntando hacia afuera (enviar correos)."},

      {"block": "BLOQUE 6: CAPA DE APLICACIÓN Y TECNOLOGÍAS MÓVILES", "acronym": "VoIP", "english": "Voice over IP", "spanish": "Voz sobre IP", "pin": "🔵", "img": "Una onda de voz humana fragmentada en cubos de datos binarios viajando por la red."},
      {"block": "BLOQUE 6: CAPA DE APLICACIÓN Y TECNOLOGÍAS MÓVILES", "acronym": "LTE", "english": "Long-Term Evolution", "spanish": "Evolución a Largo Plazo", "pin": "🟠 / 🟡", "img": "Un rayo naranja que conecta una antena celular con un teléfono a velocidades de fibra óptica."},

    ];

    let currentFilter = 'ALL';
    let practiceIndex = 0;
    let practiceSet = [];

    function getPinBadges(pinStr) {
      const pins = [];
      if (pinStr.includes('🔵')) pins.push({ code: 'APP', color: '#2563eb', bg: '#1e3a8a' });
      if (pinStr.includes('🟢')) pins.push({ code: 'TRA', color: '#16a34a', bg: '#14532d' });
      if (pinStr.includes('🔴')) pins.push({ code: 'NET', color: '#dc2626', bg: '#7f1d1d' });
      if (pinStr.includes('🟠')) pins.push({ code: 'LIN', color: '#ea580c', bg: '#7c2d12' });
      if (pinStr.includes('🟡')) pins.push({ code: 'PHY', color: '#ca8a04', bg: '#713f12' });
      return pins;
    }

    function renderCards(data) {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 3rem; color: var(--text-muted);">No se encontraron acrónimos.</div>';
        return;
      }

      const grouped = {};
      data.forEach(item => {
        if (!grouped[item.block]) grouped[item.block] = [];
        grouped[item.block].push(item);
      });

      for (const [block, items] of Object.entries(grouped)) {
        const blockEl = document.createElement('div');
        blockEl.className = 'block-header';
        blockEl.textContent = block;
        container.appendChild(blockEl);

        const grid = document.createElement('div');
        grid.className = 'cards-grid';

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';

          const pins = getPinBadges(item.pin);
          const pinsHtml = pins.map(p => `<span class="pin-tag" style="background: ${p.bg}; color: #f8fafc; border: 1px solid ${p.color};">${p.code}</span>`).join('');

          card.innerHTML = `
            <div class="card-header">
              <span class="acronym-badge">${escapeHtml(item.acronym)}</span>
              <div class="pins-container">${pinsHtml}</div>
            </div>
            <div class="term-english">${escapeHtml(item.english)}</div>
            <div class="term-spanish">${escapeHtml(item.spanish)}</div>
            <div class="mnemonic-box">
              <span>🧠</span>
              <span><strong>Imagen:</strong> ${escapeHtml(item.img)}</span>
            </div>
          `;
          grid.appendChild(card);
        });

        container.appendChild(grid);
      }
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = dataset.filter(item => {
        const matchesQuery = !query || 
          item.acronym.toLowerCase().includes(query) ||
          item.english.toLowerCase().includes(query) ||
          item.spanish.toLowerCase().includes(query) ||
          item.img.toLowerCase().includes(query);

        const pins = getPinBadges(item.pin).map(p => p.code);
        const matchesFilter = currentFilter === 'ALL' || pins.includes(currentFilter);

        return matchesQuery && matchesFilter;
      });

      renderCards(filtered);
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterData();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function startPractice() {
      practiceSet = [...dataset].sort(() => Math.random() - 0.5);
      practiceIndex = 0;
      document.getElementById('practiceOverlay').classList.add('active');
      showCard();
    }

    function closePractice() {
      document.getElementById('practiceOverlay').classList.remove('active');
    }

    function showCard() {
      const cardEl = document.getElementById('flashcard');
      cardEl.classList.remove('flipped');

      const item = practiceSet[practiceIndex];
      document.getElementById('cardAcronym').textContent = item.acronym;
      document.getElementById('cardEnglish').textContent = item.english;
      document.getElementById('cardSpanish').textContent = item.spanish;
      document.getElementById('cardMnemonic').textContent = item.img;
      document.getElementById('practiceProgress').textContent = `${practiceIndex + 1} / ${practiceSet.length}`;
    }

    function flipCard() {
      document.getElementById('flashcard').classList.toggle('flipped');
    }

    function nextCard() {
      practiceIndex = (practiceIndex + 1) % practiceSet.length;
      showCard();
    }

    renderCards(dataset);
  </script>
</body>
</html>
